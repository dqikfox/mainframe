[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --timeout=30 -q
markers =
    layer_tool: Tool-level checks (syntax + imports)
    layer_service: Service-level checks (live endpoints)
    layer_project: Project-level checks (git + skills + cron)
    layer_user: User-issue reproducers (Layer 4)